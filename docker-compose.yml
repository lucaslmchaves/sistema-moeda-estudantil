name: sistema-moeda-estudantil

services:
  db:
    image: postgres:16-alpine
    container_name: moeda_estudantil_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-moeda_estudantil}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - dados_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-moeda_estudantil}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./src/back
    container_name: moeda_estudantil_api
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-moeda_estudantil}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173,http://localhost:8000}
      JWT_SEGREDO: ${JWT_SEGREDO:-troque-este-segredo-no-arquivo-env-por-um-texto-longo}
      PASTA_UPLOADS: /app/uploads
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORTA: ${SMTP_PORTA:-587}
      SMTP_USUARIO: ${SMTP_USUARIO:-}
      SMTP_SENHA: ${SMTP_SENHA:-}
      EMAIL_REMETENTE: ${EMAIL_REMETENTE:-}
    volumes:
      - uploads:/app/uploads
    ports:
      - "8000:8000"
    command: sh -c "alembic upgrade head && python -m app.tarefas.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  front:
    build: ./src/front
    container_name: moeda_estudantil_front
    restart: always
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  dados_pg:
  uploads:
