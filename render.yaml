# Publicação da API na Render. O banco fica no Neon e o front na Vercel.
services:
  - type: web
    name: moeda-estudantil-api
    runtime: docker
    plan: free
    branch: main
    autoDeploy: true
    dockerfilePath: ./src/back/Dockerfile
    dockerContext: ./src/back
    dockerCommand: sh -c "alembic upgrade head && python -m app.tarefas.seed && uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}"
    healthCheckPath: /saude
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SEGREDO
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_PORTA
        value: "2525"
      - key: SMTP_USUARIO
        sync: false
      - key: SMTP_SENHA
        sync: false
      - key: EMAIL_REMETENTE
        sync: false
